<script>
// Navbar fades as soon as scrolling begins; the bottom-right menu trigger appears.
window.addEventListener('load', function() {
    var navbar = document.getElementById('navbar');
    var menuTrigger = document.getElementById('menu-trigger');
    var update = function() {
        var scrolled = window.scrollY > 0;
        if (navbar) navbar.classList.toggle('faded', scrolled);
        if (menuTrigger) menuTrigger.classList.toggle('visible', scrolled);
    };
    update();
    window.addEventListener('scroll', update, { passive: true });
});
</script>
